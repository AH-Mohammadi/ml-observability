[project]
name = "ml-project"
version = "0.1.0"
description = "Portfolio ML observability project — Telco customer churn"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "mlflow>=2.10",
    "fastapi>=0.110",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
